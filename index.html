
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Pulse Alerts</title>

  
<script>
(() => {
  const oldCard = document.getElementById("gold-live-card");
  if (oldCard) oldCard.remove();

  const card = document.createElement("section");
  card.id = "gold-live-card";

  card.style.cssText =
    "background:#172554;color:white;padding:22px;" +
    "margin:18px 0;border-radius:14px;" +
    "font-family:Arial,sans-serif;text-align:center;";

  card.innerHTML = `
    <h2>Gold (XAUUSD) Live Price</h2>
    <div id="gold-live-price"
      style="font-size:32px;font-weight:bold;margin:15px 0">
      Connecting...
    </div>
    <p id="gold-live-status">Connecting to price service...</p>
    <small>USD per troy ounce | Spot reference</small>
  `;

  const placeholder = [...document.querySelectorAll("p,div,span")]
    .find(el =>
      el.children.length === 0 &&
      el.textContent.toLowerCase().includes(
        "live price feed not connected"
      )
    );

  const heading = [...document.querySelectorAll("h1,h2,h3")]
    .find(el => el.textContent.includes("Gold (XAUUSD)"));

  if (placeholder) {
    placeholder.replaceWith(card);
  } else if (heading) {
    heading.insertAdjacentElement("afterend", card);
  } else {
    document.body.appendChild(card);
  }

  async function updateGoldPrice() {
    const priceBox = document.getElementById("gold-live-price");
    const statusBox = document.getElementById("gold-live-status");

    try {
      const response = await fetch(
        "https://api.gold-api.com/price/XAU",
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error("Price unavailable");
      }

      const data = await response.json();
      const price = Number(data.price);

      if (!Number.isFinite(price) || price <= 0) {
        throw new Error("Invalid price");
      }

      priceBox.textContent = "$" + price.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      statusBox.textContent =
        "Last updated: " +
        (data.updatedAtReadable || data.updatedAt || "Recently");

    } catch (error) {
      priceBox.textContent = "--";
      statusBox.textContent =
        "Price connection failed. Please refresh later.";
      console.error("Gold price error:", error);
    }
  }

  updateGoldPrice();
  setInterval(updateGoldPrice, 30000);
})();
</script>

</body>
</html>
