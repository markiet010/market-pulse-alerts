<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Pulse Alerts - Gold Price</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101827;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 520px);
      padding: 28px;
      border: 1px solid #334155;
      border-radius: 18px;
      background: #1e293b;
      box-shadow: 0 18px 50px rgba(0,0,0,.25);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .subtitle {
      margin: 0 0 26px;
      color: #cbd5e1;
    }

    .label {
      color: #cbd5e1;
      font-size: 14px;
    }

    #gold-price {
      margin: 12px 0;
      font-size: clamp(34px, 9vw, 48px);
      font-weight: 700;
    }

    #gold-status {
      color: #cbd5e1;
      font-size: 14px;
      min-height: 20px;
    }

    .note {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #334155;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main>
    <h1>Market Pulse Alerts</h1>

    <p class="subtitle">Gold market update</p>

    <div class="label">Gold (XAU) price</div>

    <div id="gold-price">Loading...</div>

    <div id="gold-status" role="status" aria-live="polite">
      Connecting to the price service...
    </div>

    <p class="note">
      Price is shown in USD per troy ounce.
      This page refreshes automatically every 30 seconds.
      Market data may be delayed or temporarily unavailable.
    </p>
  </main>

  <script>
    const priceElement = document.getElementById("gold-price");
    const statusElement = document.getElementById("gold-status");

    async function updateGoldPrice() {
      try {
        const response = await fetch(
          "https://api.gold-api.com/price/XAU",
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("Price service returned an error.");
        }

        const data = await response.json();
        const price = Number(data.price);

        if (!Number.isFinite(price) || price <= 0) {
          throw new Error("The price data was not valid.");
        }

        priceElement.textContent = new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(price);

        const updated = data.updatedAtReadable || data.updatedAt;

        statusElement.textContent = updated
          ? "Last update: " + updated
          : "Price updated successfully.";

      } catch (error) {
        priceElement.textContent = "Price unavailable";

        statusElement.textContent =
          "Could not load the live price. Please try again shortly.";

        console.error("Gold price update failed:", error);
      }
    }

    updateGoldPrice();

    setInterval(updateGoldPrice, 30000);
  </script>

</body>
</html>
